<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <!-- Old tab icon kept for reference: it read as squeezed at tab size.
         <link rel="icon" type="image/png" href="/images/icon-black.png" /> -->
    <!-- The two existing brand icons, one per browser mode: the black leaf for a
         light tab bar, the white leaf for a dark one. The plain black link first
         is the fallback for anything that ignores `media` on an icon.
         Earlier versions: <link rel="icon" type="image/png" href="/images/icon-black.png" />
                           <link rel="icon" type="image/png" href="/images/favicon-32.png" /> -->
    <link rel="icon" type="image/png" href="/images/icon-black.png" />
    <link rel="icon" type="image/png" href="/images/icon-black.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/images/icon-white.png" media="(prefers-color-scheme: dark)" />
    <script>
      /* Chrome ignores `media` on icon links, so the same rule is applied here
         with the same two existing files: icon-white.png for a dark browser bar,
         icon-black.png for a light one. Writing the file to every icon link as
         well keeps them in step, so whichever one a browser picks shows the
         right leaf. Without this the tab icon stays black in Chrome, on a dark
         tab bar. */
      (function () {
        var scheme = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
        if (!scheme) return;
        var links = document.querySelectorAll('link[rel~="icon"]');
        function apply() {
          var file = scheme.matches ? '/images/icon-white.png' : '/images/icon-black.png';
          for (var i = 0; i < links.length; i++) links[i].href = file;
        }
        apply();
        if (scheme.addEventListener) scheme.addEventListener('change', apply);
        else if (scheme.addListener) scheme.addListener(apply);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F6E56" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts are requested from the document head rather than with an @import
         inside the stylesheet: the preload scanner finds them immediately and
         the two connections open while the app bundle is still downloading,
         instead of the font request waiting for the CSS to arrive first. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />

    <!-- Page-specific head tags.
         The build replaces everything between these two markers for each public
         route (scripts/prerender.mjs) with that page's title, description,
         canonical, share tags and structured data - see src/lib/pageMeta.ts.
         What is left here is the neutral fallback used by the client-only
         routes (legal pages, accounts), which are served this file as a shell:
         no canonical, so a shell never claims to be the homepage. -->
    <!--seo:start-->
    <title>People Growth Africa | HR Consulting for African Businesses</title>
    <meta
      name="description"
      content="Practical HR and people systems for growing businesses across Nigeria and Africa."
    />
    <!--seo:end-->

    <!-- Organization identity: the single canonical entity for the whole site.
         Emitted statically (not injected by JS) so crawlers that do not execute
         JavaScript still see it, and so per-page scripts can reference it by
         @id instead of declaring a competing Organization node. -->
    <script type="application/ld+json" id="org-schema">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "ProfessionalService"],
        "@id": "https://www.peoplegrowthafrica.com/#organization",
        "name": "People Growth Africa",
        "url": "https://www.peoplegrowthafrica.com/",
        "logo": "https://www.peoplegrowthafrica.com/images/logo-black.png",
        "description": "Practical HR and people systems for growing businesses across Nigeria and Africa.",
        "areaServed": "Africa",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Apapa",
          "addressRegion": "Lagos",
          "addressCountry": "NG"
        },
        "telephone": "+2349167114560",
        "email": "hello@peoplegrowthafrica.com",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"],
            "opens": "08:00",
            "closes": "18:00",
            "timeZone": "Africa/Lagos"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday"],
            "opens": "11:00",
            "closes": "16:00",
            "timeZone": "Africa/Lagos"
          }
        ],
        "sameAs": [
          "https://www.linkedin.com/company/people-growth-africa/",
          "https://www.instagram.com/peoplegrowthafrica",
          "https://tiktok.com/@peoplegrowthafrica",
          "https://www.youtube.com/@peoplegrowthafrica",
          "https://www.facebook.com/peoplegrowthafrica"
        ]
      }
    </script>

    <!-- The site itself, as one entity. Also static: a crawler that never runs
         JavaScript still reads which site this is, what language it is written
         in, and which organization publishes it. There is no search endpoint on
         the site, so this deliberately declares no SearchAction. -->
    <script type="application/ld+json" id="website-schema">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.peoplegrowthafrica.com/#website",
        "name": "People Growth Africa",
        "url": "https://www.peoplegrowthafrica.com/",
        "inLanguage": "en-NG",
        "publisher": { "@id": "https://www.peoplegrowthafrica.com/#organization" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Version the SW cache with the deployed bundle filename, so every
          // deploy gets a fresh cache (in dev there is no bundle -> 'pga-dev').
          const bundle = document.querySelector('script[type="module"][src*="/assets/"]');
          const version = bundle ? new URL(bundle.src, location.href).pathname.split('/').pop() : '';
          const swUrl = version ? '/sw.js?v=' + encodeURIComponent(version) : '/sw.js';
          navigator.serviceWorker.register(swUrl).then((reg) => {
            console.log('PWA ServiceWorker registered with scope: ', reg.scope);
          }).catch((err) => {
            console.log('PWA ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
